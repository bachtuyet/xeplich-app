<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12253d">
<title>Lịch làm việc</title>
<script>
/* Kích hoạt chế độ ảnh sớm ngay trong head để tránh giật giao diện */
(function(){
  try {
    var q = new URLSearchParams(window.location.search);
    if(q.has('anh')){
      document.documentElement.classList.add('anh');
      if(q.get('nen') === 'sang'){
        document.documentElement.classList.add('sang');
      }
    }
  } catch(e){}
})();
</script>
<style>
  :root{
    --navy:#12253d; --blue:#2a78d6; --blueL:#e9f1fc;
    --green:#1c7c43; --greenL:#e9f5ee;
    --purple:#7c4bb0; --purpleL:#f3edfb;
    --orange:#d9622a; --orangeL:#fdf1ea;
    --red:#c0392b; --redL:#fdeceb;
    --pink:#c22a63; --pinkL:#fdeaf1;
    --ink:#12253d; --ink2:#5a6673; --muted:#98a1ac;
    --line:#e6e9ee; --bg:#f4f5f7; --card:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{--ink:#f0f3f7;--ink2:#a8b3c0;--muted:#6b7785;--line:#252b34;--bg:#0e1117;--card:#171b22;
          --blueL:#16243a;--greenL:#132520;--purpleL:#211a2e;--orangeL:#291c12;--redL:#2a1717;--pinkL:#2a1620;
          --blue:#4a94e8;--green:#4fb377;--purple:#a884d8;--orange:#e0854a;--red:#e8776b;--pink:#f2699a}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       font-size:16px;line-height:1.5;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto}

  header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 18px}
  header .r{display:flex;align-items:center;gap:11px}
  .av{width:42px;height:42px;border-radius:50%;background:#2f4d75;display:flex;align-items:center;
      justify-content:center;font-size:17px;font-weight:800;flex:none}
  header .hi{font-size:12.5px;opacity:.6;font-weight:600}
  header .nm{font-size:19px;font-weight:800;margin-top:-2px}
  header .rl{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);
             padding:5px 12px;border-radius:20px}

  .pane{padding:14px}
  .pane.hide{display:none}
  #p2{padding-bottom:80px}
  .c{background:var(--card);border-radius:15px;padding:15px;margin-bottom:11px;
     box-shadow:0 1px 3px rgba(18,37,61,.06)}
  .ct{font-size:11px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin-bottom:9px}
  .big{font-size:23px;font-weight:800;letter-spacing:-.3px}
  .sm{font-size:13.5px;color:var(--ink2)}
  .row{display:flex;align-items:center;gap:10px}
  .sp{margin-left:auto}

  .cd{background:linear-gradient(135deg,var(--blue),#1a5cae);color:#fff}
  .cd .ct{color:rgba(255,255,255,.72)}
  .cd .btn{background:#fff;color:var(--blue);border:0;width:100%;border-radius:11px;padding:13px;
           font-size:15px;font-weight:800;margin-top:12px;font-family:inherit}
  .cd.done{background:linear-gradient(135deg,var(--green),#146135)}
  .cd.done .btn{color:var(--green)}

  .ns{display:flex;gap:12px;align-items:center}
  .nsd{width:54px;height:58px;border-radius:12px;background:var(--blueL);color:var(--blue);
       display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .nsd .d1{font-size:10.5px;font-weight:800;letter-spacing:.5px}
  .nsd .d2{font-size:20px;font-weight:800;line-height:1}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;margin-right:4px}
  .t-goi{background:var(--blueL);color:var(--blue)}
  .t-chiet{background:var(--purpleL);color:var(--purple)}
  .t-ot{background:var(--orangeL);color:var(--orange)}
  .t-open{background:var(--redL);color:var(--red)}
  .t-ok{background:var(--greenL);color:var(--green)}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:11px}
  .st{background:var(--card);border-radius:13px;padding:12px 8px;text-align:center;
      box-shadow:0 1px 3px rgba(18,37,61,.06)}
  .st .v{font-size:19px;font-weight:800;line-height:1.15}
  .st .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}

  /* grid dang ky */
  .qk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
  .qb{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;
      font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
  .gh,.gr{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:7px;margin-bottom:7px}
  .gh div{font-size:10px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:.4px}
  .gh div:first-child{text-align:left;padding-left:3px}
  .gd{display:flex;flex-direction:column;justify-content:center}
  .gd .a{font-size:14px;font-weight:800}
  .gd .b{font-size:11px;color:var(--muted);font-weight:600}
  .gc{border:2px solid var(--line);background:var(--card);border-radius:11px;padding:11px 3px;
      text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);min-height:50px;
      display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .gc.on{border-color:var(--blue);background:var(--blueL);color:var(--blue)}
  .gc.on.p{border-color:var(--purple);background:var(--purpleL);color:var(--purple)}
  .gc.na{border-style:dashed;opacity:.35;cursor:default}

  /* lich doi */
  .lrow{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .lrow:last-child{border-bottom:0}
  .lrow.me{background:var(--blueL);margin:0 -15px;padding:10px 15px;border-radius:9px}
  .lday{font-size:12.5px;font-weight:800;color:var(--ink2)}
  .lday span{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
  .lppl{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}

  /* ca trong */
  .oc{background:var(--card);border-radius:14px;padding:14px;margin-bottom:11px;
      border-left:4px solid var(--red);box-shadow:0 1px 3px rgba(18,37,61,.06)}
  .oc.opt{border-left-color:var(--muted)}
  .oc .t1{font-size:15.5px;font-weight:800}
  .oc .t2{font-size:13px;color:var(--ink2);margin-top:3px}
  .oc button{background:var(--navy);color:#fff;border:0;width:100%;border-radius:11px;padding:12px;
             font-size:14.5px;font-weight:800;margin-top:11px;font-family:inherit;cursor:pointer}
  .oc.opt button{background:var(--card);color:var(--navy);border:2px solid var(--line)}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .e{font-size:38px;margin-bottom:10px}
  .empty .t{font-size:16px;font-weight:700;color:var(--ink2)}

  /* bar duoi */
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
       padding:9px 6px calc(10px + env(safe-area-inset-bottom));z-index:30}
  .barin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
  .tb{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding:5px 2px;cursor:pointer}
  .tb .i{font-size:20px;display:block;margin-bottom:1px;opacity:.45}
  .tb.on{color:var(--blue)} .tb.on .i{opacity:1}

  .sendbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));
           background:var(--card);border-top:1px solid var(--line);padding:10px 14px;z-index:29}
  .sendbar.hide{display:none}
  .sendin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .sendin .l{font-size:10.5px;font-weight:800;color:var(--muted)}
  .sendin .v{font-size:16px;font-weight:800}
  .sendin button{margin-left:auto;background:var(--blue);color:#fff;border:0;border-radius:12px;
                 padding:13px 22px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  .sendin button:disabled{background:var(--line);color:var(--muted)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--navy);
         color:#fff;padding:13px 22px;border-radius:12px;font-size:14.5px;font-weight:700;
         opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;bottom:165px}

  /* ── MÀN CHỌN TÊN ── */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;
        padding:calc(30px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  #gate.hide{display:none}
  .gin{max-width:460px;margin:0 auto}
  .glogo{width:52px;height:52px;border-radius:15px;background:var(--navy);color:#fff;font-size:25px;
         display:flex;align-items:center;justify-content:center;margin-bottom:15px}
  .gt{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .gs{font-size:14px;color:var(--ink2);margin-top:5px;margin-bottom:20px}
  .gsec{font-size:10.5px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin:16px 0 8px}
  .pbtn{display:flex;align-items:center;gap:13px;width:100%;background:var(--card);border:2px solid var(--line);
        border-radius:15px;padding:13px 15px;margin-bottom:9px;cursor:pointer;font-family:inherit;
        text-align:left;color:var(--ink);box-shadow:0 1px 3px rgba(18,37,61,.05)}
  .pbtn:active{border-color:var(--blue);background:var(--blueL)}
  .pav{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;
       justify-content:center;font-size:18px;font-weight:800}
  .pbtn .pn{font-size:17px;font-weight:800;line-height:1.25}
  .pbtn .pr{font-size:12.5px;color:var(--muted);font-weight:600}
  .pbtn .ar{margin-left:auto;color:var(--muted);font-size:19px}
  .gnote{background:var(--orangeL);color:var(--orange);border-radius:12px;padding:12px 14px;
         font-size:13px;line-height:1.5;margin-top:16px;font-weight:600}
  header .sw{margin-left:auto;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);
             padding:5px 11px;border-radius:20px;cursor:pointer;border:0;color:#fff;font-family:inherit}
  header .rl{margin-left:0}

  /* ══════════════════════════════════════════════════════════
     CHẾ ĐỘ ẢNH (GIAI ĐOẠN 3) — TỰ ĐỘNG KÍCH HOẠT KHI ?anh=1
     ══════════════════════════════════════════════════════════ */
  html.anh {
    --anh-nen: #0B1420;
    --anh-the: #12253d;
    --anh-ke: #22354d;
    --anh-chu: #E9EFF6;
    --anh-phu: #93A6BC;
    --anh-goi-nen: #38BDF8;
    --anh-goi-chu: #06202F;
    --anh-pha-nen: #A78BFA;
    --anh-pha-chu: #1B1033;
    --anh-chiet-nen: #34D399;
    --anh-chiet-chu: #04241A;
    --anh-tang-ca: #FBBF24;
    --anh-tang-ca-chu: #2A1A00;
    --anh-do: #F87171;
    --anh-do-nen: rgba(248, 113, 113, 0.14);
    --anh-do-chu: #FCA5A5;
    --anh-nghi-nen: #1A2A3E;
    --anh-nghi-chu: #5B6E85;
    --anh-cn-nen: #0d1b2a;
    --anh-xanh-la: #34D399;
    --anh-xanh-la-nen: rgba(52, 211, 153, 0.14);
  }

  html.anh.sang {
    --anh-nen: #F4F6F9;
    --anh-the: #FFFFFF;
    --anh-ke: #DDE3EA;
    --anh-chu: #16202B;
    --anh-phu: #64748B;
    --anh-goi-nen: #DCEEFB;
    --anh-goi-chu: #0B72C4;
    --anh-pha-nen: #EEE6FA;
    --anh-pha-chu: #6D3FA6;
    --anh-chiet-nen: #DDF5EC;
    --anh-chiet-chu: #0B7A57;
    --anh-tang-ca: #B26A00;
    --anh-tang-ca-chu: #FFFFFF;
    --anh-do: #C0392B;
    --anh-do-nen: rgba(192, 57, 43, 0.1);
    --anh-do-chu: #C0392B;
    --anh-nghi-nen: #F1F5F9;
    --anh-nghi-chu: #94A3B8;
    --anh-cn-nen: #F8FAFC;
    --anh-xanh-la: #0B7A57;
    --anh-xanh-la-nen: #DDF5EC;
  }

  html.anh body {
    padding-bottom: 0 !important;
    background: var(--anh-nen) !important;
    color: var(--anh-chu);
    font-family: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  }

  html.anh * {
    transition: none !important;
    animation: none !important;
  }

  html.anh header,
  html.anh .bar,
  html.anh .sendbar,
  html.anh .pane,
  html.anh #gate,
  html.anh .toast {
    display: none !important;
  }

  html.anh .wrap {
    max-width: none !important;
  }

  #anh {
    display: none;
    width: 540px;
    margin: 0 auto;
    box-sizing: border-box;
    padding: 16px 14px 14px 14px;
    background: var(--anh-nen);
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }

  html.anh #anh {
    display: block;
  }

  .anh-thoat {
    display: none;
  }

  html.anh .anh-thoat {
    display: block;
    text-align: center;
    margin: 14px auto 28px;
  }

  html.anh .anh-thoat a {
    color: var(--anh-phu);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }

  /* Bố cục Dải 1: Đầu ảnh */
  .anh-dai1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 10px;
  }
  .anh-dai1-trai {
    flex: 1;
  }
  .anh-tieu-de {
    font-size: 20px;
    font-weight: 800;
    color: var(--anh-chu);
    letter-spacing: -0.3px;
    line-height: 1.25;
  }
  .anh-phu-de {
    font-size: 12.5px;
    color: var(--anh-phu);
    margin-top: 3px;
    font-weight: 600;
    line-height: 1.3;
  }
  .anh-dai1-phai {
    text-align: right;
    flex-shrink: 0;
  }
  .anh-badge-tc {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    background: var(--anh-the);
    border: 2px solid var(--anh-tang-ca);
    color: var(--anh-tang-ca);
    padding: 4px 9px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 800;
    line-height: 1.25;
  }
  .anh-so-tc {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.25;
  }
  .anh-ds-tc {
    font-size: 12px;
    color: var(--anh-phu);
    margin-top: 3px;
    font-weight: 600;
    line-height: 1.25;
  }

  /* Bố cục Dải 2: Chú thích 3 việc */
  .anh-dai2 {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--anh-phu);
    background: var(--anh-the);
    padding: 7px 10px;
    border-radius: 8px;
    border: 2px solid var(--anh-ke);
  }
  .anh-ct-item {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .anh-cham-goi { color: var(--anh-goi-nen); font-size: 13px; }
  .anh-cham-pha { color: var(--anh-pha-nen); font-size: 13px; }
  .anh-cham-chiet { color: var(--anh-chiet-nen); font-size: 13px; }
  .anh-cham-tc { color: var(--anh-tang-ca); font-size: 13px; font-weight: 800; }
  /* Nền sáng: ô việc là màu NHẠT, nên ô vuông chú thích phải lấy màu CHỮ,
     không thì chú thích gần như tàng hình trên thẻ trắng. */
  html.anh.sang .anh-cham-goi { color: var(--anh-goi-chu); }
  html.anh.sang .anh-cham-pha { color: var(--anh-pha-chu); }
  html.anh.sang .anh-cham-chiet { color: var(--anh-chiet-chu); }

  /* Bố cục Dải 3: Bảng lịch */
  .anh-bang-wrap {
    background: var(--anh-the);
    border: 2px solid var(--anh-ke);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 11px;
  }
  .anh-hang-dau {
    display: grid;
    grid-template-columns: 76px repeat(7, 1fr);
    border-bottom: 2px solid var(--anh-ke);
    background: var(--anh-the);
  }
  .anh-cot-ten-head {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--anh-phu);
    letter-spacing: 0.5px;
    border-right: 2px solid var(--anh-ke);
  }
  .anh-cot-ngay {
    text-align: center;
    padding: 5px 2px;
    border-right: 2px solid var(--anh-ke);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .anh-cot-ngay:last-child {
    border-right: 0;
  }
  .anh-cot-ngay.anh-cn-cot {
    background: var(--anh-cn-nen);
  }
  .anh-thu {
    font-size: 15px;
    font-weight: 800;
    color: var(--anh-chu);
    line-height: 1.25;
  }
  .anh-thu.co-trong {
    border-bottom: 3px solid var(--anh-do);
    padding-bottom: 0px;
    margin-bottom: -1px;
  }
  .anh-ngay-thang {
    font-size: 12px;
    color: var(--anh-phu);
    font-weight: 600;
    line-height: 1.25;
  }
  .anh-cn-gio {
    font-size: 12px;
    color: var(--anh-tang-ca);
    font-weight: 700;
    line-height: 1.25;
    margin-top: 1px;
  }

  .anh-hang {
    display: grid;
    grid-template-columns: 76px repeat(7, 1fr);
    border-bottom: 2px solid var(--anh-ke);
  }
  .anh-hang:last-child {
    border-bottom: 0;
  }
  .anh-o-ten {
    padding: 6px 3px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: var(--anh-the);
    border-right: 2px solid var(--anh-ke);
  }
  .anh-ten-nv {
    font-size: 15px;
    font-weight: 800;
    color: var(--anh-chu);
    line-height: 1.25;
  }
  .anh-vaitro-nv {
    font-size: 12px;
    color: var(--anh-phu);
    font-weight: 600;
    margin-top: 2px;
    line-height: 1.25;
  }
  .anh-tc-nv {
    font-size: 12px;
    color: var(--anh-tang-ca);
    font-weight: 800;
    margin-top: 2px;
    line-height: 1.25;
  }

  .anh-o-ca {
    padding: 4px 3px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    justify-content: center;
    border-right: 2px solid var(--anh-ke);
    min-height: 44px;
    box-sizing: border-box;
  }
  .anh-o-ca:last-child {
    border-right: 0;
  }
  .anh-o-ca.anh-cn-cot {
    background: var(--anh-cn-nen);
  }
  .anh-o-ca.anh-o-trong {
    border: 2px dashed var(--anh-do) !important;
    background: var(--anh-do-nen) !important;
    border-radius: 4px;
    margin: 2px;
    padding: 2px 1px;
  }

  /* Chip ca
     Cao 36px = 15px×1.25 (giờ) + 12px×1.25 (nhãn) + 1px, còn thừa chỗ cho dấu
     tiếng Việt. KHÔNG dùng overflow:hidden — chữ hoa có dấu (Ế, Ữ) bị cắt ngọn. */
  .anh-chip {
    height: 36px;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    box-sizing: border-box;

const $ = i => document.getElementById(i);
const qs = new URLSearchParams(location.search);

/* Ai đang dùng: lấy từ #hash (đã chọn tên) hoặc ?u= (link riêng, nếu muốn).
   Không có thì hiện màn chọn tên. */
let uid = (location.hash.slice(1) || qs.get('u') || '').toLowerCase();

const MAU = {thanh:'#2a78d6', diem:'#c22a63', vi:'#7c4bb0',
             tai:'#1c7c43',  huy:'#d9622a',  khanh:'#0f7d8c'};

let D = DEMO, me = null, pick = {}, tab = 0;

/* Helper nhãn việc chế độ ảnh */
function nhanViec(v){
  if(!v) return 'GÓI';
  const s = v.toLowerCase();
  if(s.includes('pha')) return 'PHA';
  if(s.includes('chiết') || s.includes('chiet')) return 'CHIẾT';
  return 'GÓI';
}
function lopViec(v){
  if(!v) return 'goi';
  const s = v.toLowerCase();
  if(s.includes('pha')) return 'pha';
  if(s.includes('chiết') || s.includes('chiet')) return 'chiet';
  return 'goi';
}
/* '8h – 12h' (chuỗi Sheet) → '8–12' cho vừa bề ngang cột 62px */
function gonKhung(k){
  const s = String(k || '');
  const m = s.match(/(\d+)\D+(\d+)/);
  return m ? m[1] + '–' + m[2] : s.replace(/\s+/g, '');
}
/* Thứ tự hàng: nhóm theo VIỆC (đóng gói → pha chế → part-time) như mục 5.3 kế
   hoạch, không theo thứ tự tab NhanVien (tab đang là thanh, diem, vi, tai…)
   và không hard-code tên — người thứ 7 vào làm vẫn tự xếp đúng nhóm. */
function thuTuNguoi(nguoi){
  const bac = { full: 0, lai: 1, part: 2 };
  return Object.keys(nguoi || {}).sort((a, b) => {
    const x = bac[(nguoi[a].loai || 'part').toLowerCase()];
    const y = bac[(nguoi[b].loai || 'part').toLowerCase()];
    return (x === undefined ? 2 : x) - (y === undefined ? 2 : y);
  });
}

/* ── LUỒNG CHẾ ĐỘ ẢNH ── */
async function napAnh(){
  try {
    // Dữ liệu THẬT từ action=anh — lỗi mạng phải ra thẻ đỏ, không dùng dữ liệu giả
    let dAnh = null;
    const tuanParam = qs.get('tuan');
    if (API) {
      try {
        dAnh = await (await fetch(`${API}?action=anh${tuanParam ? '&tuan=' + encodeURIComponent(tuanParam) : ''}`)).json();
      } catch (err) {
        veAnhLoi(err.message || 'Lỗi mạng');
        document.body.setAttribute('data-anh', 'loi');
        return;
      }
    }

    // Không có URL API thì không có gì để vẽ — ra thẻ đỏ luôn, đừng để ném lỗi
    // ở dòng dưới rồi mới bắt được (thẻ đỏ khi đó không nói được lý do thật).
    if (!dAnh){
      veAnhLoi('Chưa cấu hình URL Apps Script (hằng số API rỗng)');
      document.body.setAttribute('data-anh', 'loi');
      return;
    }

    // Lưu ý: server LUÔN có ô loi (rỗng khi không lỗi) — kiểm nội dung, không kiểm tồn tại
    if (dAnh && dAnh.loi){
      veAnhLoi(dAnh.loi);
      document.body.setAttribute('data-anh', 'loi');
      return;
    }

    if(!dAnh.lich || dAnh.lich.length === 0){
      veAnhChuaXep(dAnh);
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
      document.body.setAttribute('data-anh', 'xong');
      return;
    }

    veAnh(dAnh);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    document.body.setAttribute('data-anh', 'xong');
  } catch(e){
    console.error(e);
    veAnhLoi(e.message || 'Lỗi không xác định');
    document.body.setAttribute('data-anh', 'loi');
  }
}

function veAnh(dData){
  const el = $('anh');
  if(!el) return;

  // 1. Tính tăng ca
  let tongOt = 0;
  const nguoiOt = {};
  (dData.lich || []).forEach(r => {
    const ot = Number(r.ot) || 0;
    if(ot > 0){
      tongOt += ot;
      nguoiOt[r.id] = (nguoiOt[r.id] || 0) + ot;
    }
  });

  const dsOtStr = Object.keys(nguoiOt).map(id => {
    const ten = (dData.nguoi[id] && dData.nguoi[id].ten) || id;
    return `${ten} ${nguoiOt[id]}h`;
  }).join(' · ');

  // 2. Dải 1: Đầu ảnh
  const dai1Html = `
    <div class="anh-dai1">
      <div class="anh-dai1-trai">
        <div class="anh-tieu-de">LỊCH TUẦN ${dData.tuan.dau} – ${dData.tuan.cuoi}</div>
        <div class="anh-phu-de">Cửa hàng · T2–T7 8h–19h · CN 8h–12h</div>
      </div>
      <div class="anh-dai1-phai">
        <div class="anh-badge-tc">⚡ TĂNG CA <span class="anh-so-tc">${tongOt}h</span></div>
        ${dsOtStr ? `<div class="anh-ds-tc">${dsOtStr}</div>` : ''}
      </div>
    </div>
  `;

  // 3. Dải 2: Chú thích 3 việc
  const dai2Html = `
    <div class="anh-dai2">
      <span class="anh-ct-item"><span class="anh-cham anh-cham-goi">■</span> ĐÓNG GÓI</span>
      <span class="anh-ct-item"><span class="anh-cham anh-cham-pha">■</span> PHA CHẾ</span>
      <span class="anh-ct-item"><span class="anh-cham anh-cham-chiet">■</span> CHIẾT</span>
      <span class="anh-ct-item"><span class="anh-cham anh-cham-tc">▨</span> tăng ca</span>
    </div>
  `;

  // 4. Dải 3: Bảng lịch
  const ngayCoCaTrong = new Set((dData.caTrong || []).map(ct => ct.iso));

  let headColsHtml = `<div class="anh-cot-ten-head">NHÂN VIÊN</div>`;
  dData.ngay.forEach(d => {
    const coTrong = ngayCoCaTrong.has(d.iso);
    const cnCls = d.cn ? ' anh-cn-cot' : '';
    headColsHtml += `
      <div class="anh-cot-ngay${cnCls}">
        <div class="anh-thu${coTrong ? ' co-trong' : ''}">${d.k}</div>
        <div class="anh-ngay-thang">${d.ngay}</div>
        ${d.cn ? '<div class="anh-cn-gio">8h–12h</div>' : ''}
      </div>
    `;
  });

  // Thứ tự hàng: nhóm theo việc (Tài, Huy, Khánh → Vi → Thanh, Diễm)
  const danhSachId = thuTuNguoi(dData.nguoi);
  let rowsHtml = '';
  danhSachId.forEach(pid => {
    const p = dData.nguoi[pid];
    const otNguoi = nguoiOt[pid] || 0;
    const otLine = otNguoi > 0 ? `<div class="anh-tc-nv">⚡ ${otNguoi}h</div>` : '';

    let cellsHtml = `
      <div class="anh-o-ten">
        <div class="anh-ten-nv">${p.ten}</div>
        <div class="anh-vaitro-nv">${p.vaitro}</div>
        ${otLine}
      </div>
    `;

    dData.ngay.forEach(d => {
      const cnCls = d.cn ? ' anh-cn-cot' : '';
      const shifts = (dData.lich || []).filter(r => r.id === pid && r.iso === d.iso);
      shifts.sort((a, b) => Number(a.tu) - Number(b.tu));

      // Quy tắc gộp 2 đoạn liền nhau: cùng viec VÀ cùng trạng thái ot VÀ den đoạn trước == tu đoạn sau
      const gop = [];
      for(const s of shifts){
        if(gop.length === 0){
          gop.push({ ...s });
        } else {
          const prev = gop[gop.length - 1];
          const cungViec = (prev.viec || '').trim().toLowerCase() === (s.viec || '').trim().toLowerCase();
          const prevOt = (Number(prev.ot) || 0) > 0;
          const currOt = (Number(s.ot) || 0) > 0;
          const cungOt = prevOt === currOt;
          const lienNhau = Number(prev.den) === Number(s.tu);

          if(cungViec && cungOt && lienNhau){
            prev.den = s.den;
            prev.ot = (Number(prev.ot) || 0) + (Number(s.ot) || 0);
          } else {
            gop.push({ ...s });
          }
        }
      }

      let cellInner = '';
      if(gop.length > 0){
        cellInner = gop.map(s => {
          const nhan = nhanViec(s.viec);
          const lop = lopViec(s.viec);
          const isOt = (Number(s.ot) || 0) > 0;
          const otNum = Number(s.ot) || 0;
          const badge = isOt ? `<span class="anh-chip-tc-badge">+${otNum}h</span>` : '';
          const tcCls = isOt ? ' anh-chip-tc' : '';
          return `
            <div class="anh-chip anh-chip-${lop}${tcCls}">
              ${badge}
              <div class="anh-chip-gio">${s.tu}–${s.den}</div>
              <div class="anh-chip-nhan">${nhan}</div>
            </div>
          `;
        }).join('');
      } else {
        if(d.cn){
          cellInner = ''; // Chủ nhật không có ca: để trống hoàn toàn nền chìm
        } else {
          cellInner = `<div class="anh-chip-nghi">NGHỈ</div>`;
        }
      }

      cellsHtml += `<div class="anh-o-ca${cnCls}">${cellInner}</div>`;
    });

    rowsHtml += `<div class="anh-hang">${cellsHtml}</div>`;
  });

  /* Hàng cuối bảng: CẦN NGƯỜI — mỗi cột ngày có ca trống thì ô đó viền đỏ đứt.
     Dựng từ mảng caTrong nên tuần nào cũng đúng; KHÔNG tô đỏ ô "NGHỈ" của
     nhân viên (người ta đã xin nghỉ, tô đỏ là làm họ tưởng phải đi làm bù). */
  let rowCanHtml = '';
  if((dData.caTrong || []).length > 0){
    const theoNgay = {};
    dData.caTrong.forEach(ct => {
      (theoNgay[ct.iso] = theoNgay[ct.iso] || []).push(ct);
    });
    let canCells = `<div class="anh-o-ten"><div class="anh-ten-can">⚠ CẦN<br>NGƯỜI</div></div>`;
    dData.ngay.forEach(d => {
      const cnCls = d.cn ? ' anh-cn-cot' : '';
      const ds = theoNgay[d.iso] || [];
      if(ds.length === 0){
        canCells += `<div class="anh-o-ca${cnCls}"></div>`;
      } else {
        const nhan = ds.length === 1 ? gonKhung(ds[0].khung) : ds.length + ' CA';
        canCells += `<div class="anh-o-ca anh-o-trong${cnCls}"><div class="anh-chip-can">${nhan}</div></div>`;
      }
    });
    rowCanHtml = `<div class="anh-hang anh-hang-can">${canCells}</div>`;
  }

  const dai3Html = `
    <div class="anh-bang-wrap">
      <div class="anh-hang-dau">${headColsHtml}</div>
      ${rowsHtml}
      ${rowCanHtml}
    </div>
  `;

  // 5. Dải 4: Ca trống
  let dai4Html = '';
  if(dData.caTrong && dData.caTrong.length > 0){
    const chipTrongList = dData.caTrong.map(ct => {
      const ngayObj = dData.ngay.find(n => n.iso === ct.iso) || {};
      const thu = ngayObj.k || ct.iso;
      // Nhãn ngắn GÓI/PHA/CHIẾT như trong bảng, giờ gọn '8–12h': xếp được 3 chip
      // một dòng thay vì 2 → dải đỏ thấp lại, ảnh không vượt trần 1920px.
      return `<div class="anh-chip-trong">${thu} · ${gonKhung(ct.khung)}h · ${nhanViec(ct.viec)}</div>`;
    }).join('');

    dai4Html = `
      <div class="anh-dai4">
        <div class="anh-dai4-tieu-de">⚠ ${dData.caTrong.length} CA CHƯA CÓ NGƯỜI</div>
        <div class="anh-dai4-danh-sach">${chipTrongList}</div>
      </div>
    `;
  } else {
    dai4Html = `
      <div class="anh-dai4">
        <div class="anh-dai4-du">✓ ĐỦ NGƯỜI CẢ TUẦN</div>
      </div>
    `;
  }

  // 6. Dải 5: Chân ảnh
  const dai5Html = `
    <div class="anh-dai5">
      <div class="anh-chot">Chốt ${dData.chot || '20:07 · 17/08'} — bấm link trong tin nhắn</div>
    </div>
  `;

  el.innerHTML = dai1Html + dai2Html + dai3Html + dai4Html + dai5Html;
  // Cờ tuần để chup-anh.js đặt tên file đúng ngày thứ 2 khi chạy không tham số
  if(dData.tuan_id) document.body.setAttribute('data-tuan', dData.tuan_id);
}

    q.innerHTML = `<button class="qb" onclick="chonHet()">Chọn hết</button>`;
  }
  q.innerHTML += `<button class="qb" onclick="pick={};veLuoi();">Xoá hết</button>`;

  const cols = `1.35fr ${C.map(()=>'1fr').join(' ')}`;
  $('gh').style.gridTemplateColumns = cols;
  $('gh').innerHTML = '<div>NGÀY</div>'+C.map(c=>`<div>${c.n}<br><span style="opacity:.7">${c.g}</span></div>`).join('');
  veLuoi();
}

function chonHet(){ D.ngay.forEach(d=>cot().forEach(c=>{ if(coO(d,c.k)) set(d.k,c.k,true); })); veLuoi(); }

function veLuoi(){
  const C = cot(), cols = `1.35fr ${C.map(()=>'1fr').join(' ')}`;
  $('grid').innerHTML = D.ngay.map(d=>{
    const cells = C.map(c=>{
      const co = coO(d,c.k), on = co && get(d.k,c.k);
      return co
        ? `<button class="gc ${c.c}${on?' on':''}" onclick="set('${d.k}','${c.k}',${!on});veLuoi()">${on?(me.loai==='full'?'✓ nghỉ':'✓ rảnh'):'+'}</button>`
        : `<div class="gc na">—</div>`;
    }).join('');
    return `<div class="gr" style="grid-template-columns:${cols}">
      <div class="gd"><div class="a">${d.ten}</div><div class="b">${d.ngay}</div></div>${cells}</div>`;
  }).join('');
  tinh();
}

function tinh(){
  let n=0, gio=0, thieu=[], caNgay=[];
  D.ngay.forEach(d=>{
    const p = pick[d.k]||{};
    if(me.loai==='part'){ if(p.s){n++;gio+=4;} if(p.c){n++;gio+=4;} }
    else if(me.loai==='lai'){ if(p.s){n++;gio+=2;} if(p.t){n++;gio+=1;} if(!d.cn&&!p.s) thieu.push(d.ten); }
    else if(NGHI.some(k=>p[k])){ n++; if(p.n && !d.cn) caNgay.push(d.ten); }
  });
  const full = me.loai==='full';
  $('sendv').textContent = full ? (n?`${n} ngày nghỉ`:'Đi làm đủ tuần') : (n?`${n} ca · ${gio} giờ`:'Chưa chọn');
  $('sendbtn').disabled = !full && n===0;

  let w = '';
  if(me.loai==='lai' && thieu.length)
    w = `<div class="c" style="background:var(--orangeL);box-shadow:none"><div class="sm" style="color:var(--orange)">
       ⚠️ Chưa nhận ca sáng của <b>${thieu.join(', ')}</b>. Cửa hàng sẽ phải gọi Huy hoặc Khánh vào bù.</div></div>`;
  if(full && caNgay.length)
    w = `<div class="c" style="background:var(--orangeL);box-shadow:none"><div class="sm" style="color:var(--orange)">
       ⚠️ Nghỉ cả ngày <b>${caNgay.join(', ')}</b> để lại ô trống lúc 16h–17h, và hôm đó không chiết chai được.<br><br>
       Nếu chỉ cần nửa buổi thì chọn <b>Nghỉ chiều</b> — đội không phải bù giờ nào.</div></div>`;
  $('warn').innerHTML = w;
}

function veCaTrong(){
  const L = D.caTrong || [];
  $('openList').innerHTML = L.length ? L.map(o=>`
    <div class="oc${o.ot?'':' opt'}">
      <div class="row"><div class="t1">${o.thu}</div>
        <div class="sp tag ${o.ot?'t-ot':'t-ok'}">${o.ot?'+ TĂNG CA':'KHÔNG BẮT BUỘC'}</div></div>
      <div class="t2"><b>${o.gio}</b> · ${o.viec}</div>
      <div class="t2" style="color:var(--muted)">${o.ly}</div>
      <button onclick="nhanCa('${o.id}')">Nhận ca này</button>
    </div>`).join('')
    : `<div class="empty"><div class="e">✅</div><div class="t">Không có ca nào cần người</div></div>`;
}

function demNguoc(){
  const tick = ()=>{
    const con = new Date(HAN) - new Date();
    if(con<=0){ $('cdCard').classList.add('done');
      $('cdText').textContent='Đã chốt lịch'; $('cdSub').textContent='Xem lịch tuần này ở dưới'; return; }
    const h = Math.floor(con/3600000), m = Math.floor(con%3600000/60000);
    $('cdText').textContent = h>=24 ? `Còn ${Math.floor(h/24)} ngày ${h%24} giờ` : `Còn ${h} giờ ${m} phút`;
    $('cdSub').textContent = 'Hạn chót 20h thứ 7';
  };
  tick(); setInterval(tick,30000);
}

function go(i){
  tab=i;
  [0,1,2].forEach(x=>{ $('p'+(x+1)).classList.toggle('hide',x!==i); $('tb'+x).classList.toggle('on',x===i); });
  $('sendbar').classList.toggle('hide', i!==1);
  scrollTo(0,0);
}

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),2200); }

async function guiDangKy(){
  const data = { action:'dangky', u:uid, tuan:`${D.tuan.dau}-${D.tuan.cuoi}`, ca:pick };
  console.log('GỬI →', data);

  if(!API){
    // Chế độ demo (không có API) — không có server để xác nhận thật.
    toast('✓ Đã gửi đăng ký (demo)'); go(0);
    return;
  }

  const btn = $('sendbtn');
  const nhanCu = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Đang gửi…'; }

  try{
    const r = await fetch(API, { method:'POST', body: JSON.stringify(data) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    let j = null;
    try{ j = await r.json(); }catch(e){ /* server có thể trả rỗng, coi như OK nếu HTTP ok */ }
    if(j && j.ok === false){ throw new Error(j.loi || 'Server từ chối đăng ký'); }

    toast('✓ Đã gửi đăng ký — server đã xác nhận'); go(0);
  }catch(e){
    console.error('Gửi đăng ký thất bại:', e);
    toast('⚠️ GỬI THẤT BẠI — mạng lỗi hoặc server không nhận. Bấm Gửi lại!');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = nhanCu || 'Gửi'; }
  }
}
async function nhanCa(id){
  if(API){
    try{
      const r = await (await fetch(API,{method:'POST',body:JSON.stringify({action:'nhan',u:uid,id})})).json();
      if(!r.ok){ toast('⚠️ ' + r.loi); return; }
    }catch(e){
      toast('⚠️ Mạng lỗi, bấm lại'); return;
    }
  }
  D.caTrong = D.caTrong.filter(o=>o.id!==id); veCaTrong(); toast('✓ Đã nhận ca');
}

nap();
</script>
